[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-sciences-scigantic"
version = "0.1.0"
description = "MCP server for Scigantic, a cross-domain catalog of public scientific datasets with pre-computed schema cards."
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kiro Life Sciences Contributors" },
]
keywords = [
    "kiro",
    "life-sciences",
    "scigantic",
    "mcp",
    "bioinformatics",
    "datasets",
    "catalog",
    "schema-card",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "life-sciences-common>=0.1.0,<1",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.22,<1",
]

[project.scripts]
life-sciences-scigantic = "life_sciences_scigantic.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/life_sciences_scigantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
