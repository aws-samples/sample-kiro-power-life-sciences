[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-sciences-molbio"
version = "0.1.0"
description = "MCP server for molecular biology and biochemistry tools including BLAST, MSA, HMMER, Primer3, restriction analysis, and REBASE."
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kiro Life Sciences Contributors" },
]
keywords = [
    "kiro",
    "life-sciences",
    "molecular-biology",
    "mcp",
    "bioinformatics",
    "blast",
    "hmmer",
    "primer3",
    "restriction-enzymes",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "life-sciences-common>=0.1.0,<1",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.22,<1",
]

[project.scripts]
life-sciences-molbio = "life_sciences_molbio.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/life_sciences_molbio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
# Pin the shared base package to its local path within this repository so that
# pip/uv/uvx never resolve "life-sciences-common" from public PyPI. The name is
# not registered on PyPI; resolving it from the public index would be a
# dependency-confusion vector (AWS VDP H1-4044548).
life-sciences-common = { path = "../life-sciences-common", editable = true }
